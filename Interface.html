<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="Interface.css">
        <title>
            Weather Today
        </title>
    </head>
    <body class="Background">
        <div class="Heading">
            &#9729; Today's Weather &#9729;
        </div>
        <div>
            <p class="Weather-emoji">☀️</p>
        </div>
        <div class="Temperature">
            29 &deg;C
        </div>
        <div class="City-name">
            📍Kochi
        </div>
        <div class="Weather-Desc">
            Partly Cloudy
        </div>
        <div class="Description-box">
            <div class="Info">
                <span>💧 Humidity</span>
                <span class="values">72%</span>
            </div>
            <div class="Info">
                <span>🌬 Wind</span>
                <span class="values">12 km/h</span>
            </div>
            <div class="Info">
                <span>🌅 Sunrise</span>
                <span class="values">6:12 AM</span>
            </div>
            <div class="Info">
                <span>🌇 Sunset</span>
                <span class="values">6:43 PM</span>
            </div>
            <div class="Info">
                <span>🌎 Country</span>
                <span class="values">IND</span>
            </div>
        </div>
        <div>
            <div>
                <button class="City-Change" onclick="
                if (selection === true) {
                    showPopup();
                    selection = false;
                } else if (selection === false) {
                    hidePopup();
                    selection = true;
                }
                    ">
                    📍
                </button>
            </div>
        <div class="Pop-up">
            <input class="Search-Bar" type="text" placeholder="🔍 Search city">
            <div class="City-list">
                <div class="City-item" onclick="
                    city = 'Seoul';
                    selectcity('Seoul');
                    hidePopup();
                    ">📍Seoul</div>
                <div class="City-item" onclick="
                    city = 'Kochi';
                    selectcity('Kochi');
                    hidePopup();
                    ">📍Kochi</div>
                <div class="City-item" onclick="
                    city = 'London';
                    selectcity('London');
                    hidePopup();
                    ">📍London</div>
                <div class="City-item" onclick="
                    city = 'Mumbai';
                    selectcity('Mumbai');
                    hidePopup();
                    ">📍Mumbai</div>
                <div class="City-item" onclick="
                    city = 'Bangalore';
                    selectcity('Bangalore');
                    hidePopup();
                    ">📍Bangalore</div>
                <div class="City-item" onclick="
                    city = 'Chennai';
                    selectcity('Chennai');
                    hidePopup();
                    ">📍Chennai</div>
                <div class="City-item" onclick="
                    city = 'New York';
                    selectcity('New York');
                    hidePopup();
                    ">📍New York</div>
                <div class="City-item" onclick="
                    city = 'Los Angeles';
                    selectcity('Los Angeles');
                    hidePopup();
                    ">📍Los Angeles</div>
                <div class="City-item" onclick="
                    city = 'Delhi';
                    selectcity('Delhi');
                    hidePopup();
                    ">📍Delhi</div>
                <div class="City-item" onclick="
                    city = 'Madras';
                    selectcity('Madras');
                    hidePopup();
                    ">📍Madras</div>
            </div>
        </div>
        <script src="Interface.js"></script>
    </body>
</html>
